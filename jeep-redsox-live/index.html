<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070c16">
  <title>Justin's Red Sox Live — Jeep</title>
  <link rel="stylesheet" href="../jeep-redsox-live.css?v=4">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-lockup">
        <span class="brand-mark">J</span>
        <div>
          <div class="brand-title">JUSTIN'S RED SOX LIVE</div>
          <div class="brand-subtitle">JEEP DISPLAY • RED SOX ONLY</div>
        </div>
      </div>
      <div class="connection-lockup">
        <span id="connectionDot" class="status-dot"></span>
        <span id="connectionText">CONNECTING LIVE DATA</span>
        <span class="header-separator"></span>
        <span id="clock" class="num">--:--</span>
      </div>
    </header>

    <section id="scoreBox" class="score-box" aria-live="polite">
      <div class="loading-state">CONNECTING TO MLB LIVE DATA…</div>
    </section>

    <main class="dashboard-grid">
      <section id="pitchingPanel" class="panel pitching-panel">
        <div class="panel-heading red-heading"><span class="heading-rule"></span><h2>LIVE PITCHING</h2><span id="pitchingMeta" class="panel-meta">WAITING</span></div>
        <div id="pitchingContent" class="panel-content"><div class="loading-state">LIVE PITCHERS WILL APPEAR HERE</div></div>
      </section>

      <section id="lineupPanel" class="panel lineup-panel">
        <div class="panel-heading blue-heading"><span class="heading-rule"></span><h2>RED SOX LINEUP</h2><span id="lineupMeta" class="panel-meta">WAITING</span></div>
        <div id="lineupContent" class="panel-content"><div class="loading-state">LINEUP WILL APPEAR HERE</div></div>
      </section>

      <section id="breakdownPanel" class="panel breakdown-panel">
        <div class="panel-heading amber-heading"><span class="heading-rule"></span><h2>REAL-TIME BREAKDOWN</h2><span id="breakdownMeta" class="panel-meta">REFRESH 15S</span></div>
        <div id="breakdownContent" class="panel-content"><div class="loading-state">PITCH TRACK WILL APPEAR HERE</div></div>
      </section>
    </main>

    <div id="notice" class="notice" role="status"></div>
  </div>
  <script src="../jeep-redsox-live.js?v=4" defer></script>
</body>
</html>
