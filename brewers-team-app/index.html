<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061425"><title>Merrimack Brewers App</title><style>html,body{margin:0;min-height:100%;background:#061425;color:#fff;font:14px system-ui}#load{min-height:100vh;display:grid;place-items:center;text-align:center}.ball{font-size:42px;animation:b 1s infinite alternate}@keyframes b{to{transform:translateY(-8px)}}</style></head><body><div id="load"><div><div class="ball">⚾</div><b>Loading Merrimack Brewers…</b></div></div><script>Promise.all(['p1.txt','p2.txt','p3.txt'].map(x=>fetch(x+'?v=1').then(r=>{if(!r.ok)throw Error(x);return r.text()}))).then(p=>{document.open();document.write(p.join(''));document.close()}).catch(e=>{document.getElementById('load').innerHTML='<div><b>Prototype failed to load.</b><br><small>'+e.message+'</small></div>'})</script></body></html>
