<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Justin’s live fantasy football command center for Sleeper and ESPN leagues.">
  <title>Justin’s Fantasy Command Center</title>
  <link rel="stylesheet" href="styles.css?v=38">
  <link rel="stylesheet" href="professional.css?v=2">
</head>
<body data-root="./" data-layout="monitor">
  <div class="touch-app">
    <header class="touch-header">
      <div class="brand-lockup"><span class="brand-mark logo-mark"><img src="assets/justin-mascot-cutout.png" alt="Justin Senus mascot"></span><div><strong>Justin’s Fantasy Command Center</strong><small>TOUCH MONITOR • SLEEPER + ESPN • LIVE</small></div></div>
      <nav class="top-nav" aria-label="Fantasy views">
        <button data-view="overview" class="active" type="button">HOME</button>
        <button data-view="matchups" type="button">MATCHUPS</button>
        <button data-view="players" type="button">PLAYERS</button>
        <button data-view="injuries" type="button">INJURIES</button>
        <button data-view="live" type="button">LIVE GAMES</button>
      </nav>
      <div class="connection-lockup"><span id="connectionDot" class="status-dot"></span><span id="connectionText">CONNECTING</span><span id="clock">--:--</span></div>
    </header>

    <section class="control-strip">
      <div class="league-switcher"><span class="strip-label">LEAGUE</span><button data-league="sleeper" class="active" type="button">SLEEPER <b>THE BIG SENUS</b></button><button data-league="espn" type="button">ESPN <b>GUMBY'S BIG D</b></button></div>
      <div class="week-control"><strong id="weekLabel">WEEK —</strong><button class="refresh-action" data-action="refresh" type="button">REFRESH NOW</button></div>
      <div class="control-status"><span id="sourceStatus">FEEDS SYNCING</span><span id="oddsStatus">ODDS NOT CONNECTED</span></div>
    </section>

    <main>
      <section id="matchupHero"><div class="loading-panel">LOADING MATCHUP CENTER…</div></section>
      <section id="workspace" class="workspace"><div class="loading-panel">LOADING LIVE FANTASY DATA…</div></section>
    </main>

    <aside id="playerDrawer" class="player-drawer" aria-live="polite"></aside>

    <footer class="touch-footer"><span><i class="footer-dot"></i>FANTASY DATA ONLY • ACTUAL/LIVE PRIMARY • PROJ ALWAYS VISIBLE</span><span id="lastSync">SYNC --:--</span></footer>
  </div>
  <script src="source-catalog.js?v=2"></script>
  <script src="app-orange-matchups-v38.js?v=38" defer></script>
</body>
</html>
