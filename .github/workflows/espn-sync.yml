name: ESPN private fantasy sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: espn-private-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync private ESPN roster
        if: ${{ env.ESPN_S2 != '' && env.ESPN_SWID != '' }}
        continue-on-error: true
        env:
          ESPN_LEAGUE_ID: "919590140"
          ESPN_SEASON: "2026"
          ESPN_TEAM_NAME: "Gumby's Big D"
        run: node scripts/espn-sync.mjs

      - name: Explain missing setup
        if: ${{ env.ESPN_S2 == '' || env.ESPN_SWID == '' }}
        run: echo "Add ESPN_S2 and ESPN_SWID in repository Actions secrets before running the sync."

      - name: Commit refreshed dashboard data
        if: ${{ env.ESPN_S2 != '' && env.ESPN_SWID != '' }}
        run: |
          if git diff --quiet -- patriots-fantasy/espn-data.json; then
            echo "No ESPN changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patriots-fantasy/espn-data.json
          git commit -m "Refresh ESPN fantasy sync"
          git push
