      const orangeCSS = `
        :root { --teal: ${ORANGE} !important; }
        .brand-mark img, .hero-mark, .hero-graffiti, .about-mark, .footer-brand img {
          filter: brightness(0) saturate(100%) invert(47%) sepia(99%) saturate(3668%) hue-rotate(4deg) brightness(105%) contrast(102%) !important;
        }
        .hero-graffiti {
          width: 10.8rem !important;
          height: 5.4rem !important;
          transform: scaleX(1.38) rotate(-2deg) !important;
          transform-origin: left center !important;
          object-position: left center !important;
        }
        .hero-signal { gap: 1.35rem !important; }
        .hero-drips::before, .hero-drips i, .menu-toggle__icon i { background: ${ORANGE} !important; }
        .scribble::before, .scribble::after, .scribble i { border-top-color: ${ORANGE} !important; }
        ::selection { background: ${ORANGE} !important; }

        /* Keep every project thumbnail uniform while preserving the original art in the modal. */
        .project-card__media, .project-card--feature .project-card__media {
          position: relative !important;
          display: grid !important;
          place-items: center !important;
          aspect-ratio: 4 / 3 !important;
          overflow: hidden !important;
          padding: clamp(1.1rem, 2.2vw, 1.8rem) !important;
          background: #d9d1c3 !important;
          border: 1px solid rgba(20,27,27,.12) !important;
          isolation: isolate !important;
        }
        .project-card__media::before {
          content: "";
          position: absolute;
          z-index: 0;
          inset: -7%;
          background-image: var(--thumb-bg);
          background-size: cover;
          background-position: center;
          filter: blur(24px) saturate(.82) brightness(.78);
          opacity: .32;
          transform: scale(1.08);
        }
        .project-card__media::after {
          content: "" !important;
          display: block !important;
          position: absolute;
          z-index: 1;
          inset: 0;
          background: linear-gradient(145deg, rgba(243,239,224,.58), rgba(243,239,224,.18) 52%, rgba(20,27,27,.08));
          pointer-events: none;
        }
        .project-card__media img {
          position: relative !important;
          z-index: 2 !important;
          display: block !important;
          width: auto !important;
          height: auto !important;
          max-width: 88% !important;
          max-height: 88% !important;
          object-fit: contain !important;
          object-position: center !important;
          margin: auto !important;
          box-shadow: 0 18px 42px rgba(20,27,27,.18);
          filter: saturate(.98) contrast(1.01) !important;
          transform-origin: center !important;
        }
        .project-card:hover .project-card__media img { transform: scale(1.02) !important; }
        .project-card__count { z-index: 4 !important; border-top: 2px solid ${ORANGE}; }

        /* Past Jobs is intentionally first in the orange preview. */
        .work-tabs { align-items: stretch; }
        .work-tab[data-tab-target="past-jobs"].is-active { color: var(--ink); }

        /* ENE feature is the first experience visitors see. */
        .ene-case-study {
          margin: 1.35rem 0 3.2rem;
          padding: clamp(2rem, 4.5vw, 4.5rem);
          background: #101616;
          color: #f3efe0;
          border-top: 3px solid ${ORANGE};
          overflow: hidden;
          position: relative;
        }
        .ene-case-study::after {
          content: "ENE";
          position: absolute;
          right: -1.5rem;
          top: -2.2rem;
          color: rgba(255,106,0,.055);
          font: 900 clamp(8rem, 18vw, 16rem)/.8 var(--display);
          letter-spacing: -.08em;
          pointer-events: none;
        }
        .ene-case-study__logo {
          position: relative;
          z-index: 2;
          display: block;
          width: min(27rem, 78%);
          height: auto;
          margin: 0 0 2.15rem;
        }
        .ene-case-study__head {
          position: relative;
          z-index: 2;
          display: grid;
          grid-template-columns: minmax(0,.88fr) minmax(320px,1.12fr);
          gap: 3rem;
          align-items: end;
          padding-bottom: 2rem;
          border-bottom: 1px solid rgba(243,239,224,.22);
        }
        .ene-kicker { margin: 0 0 .9rem; color: ${ORANGE}; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .2em; }
        .ene-case-study h3 { margin: 0; font: 800 clamp(3.5rem, 7vw, 7rem)/.82 var(--display); text-transform: uppercase; letter-spacing: -.035em; }
        .ene-case-study h3 em { color: ${ORANGE}; font-style: normal; }
        .ene-summary { max-width: 40rem; margin: 0; color: rgba(243,239,224,.78); font-size: clamp(1rem, 1.5vw, 1.2rem); line-height: 1.55; }
        .ene-meta { position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: .6rem 1.8rem; padding: 1.15rem 0 2rem; color: rgba(243,239,224,.48); font-size: .62rem; text-transform: uppercase; letter-spacing: .16em; }
        .ene-meta strong { color: #f3efe0; font-weight: 600; }
        .ene-capabilities { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); border-top: 1px solid rgba(243,239,224,.18); border-left: 1px solid rgba(243,239,224,.18); }
        .ene-capability { min-height: 14rem; padding: 1.35rem 1.3rem 1.6rem; border-right: 1px solid rgba(243,239,224,.18); border-bottom: 1px solid rgba(243,239,224,.18); background: rgba(255,255,255,.018); }
        .ene-capability__number { margin: 0 0 2rem; color: ${ORANGE}; font: 700 .62rem var(--body); letter-spacing: .18em; }
        .ene-capability h4 { margin: 0 0 .7rem; color: #f3efe0; font: 700 clamp(1.55rem,2.3vw,2.25rem)/.9 var(--display); text-transform: uppercase; }
        .ene-capability p { margin: 0; color: rgba(243,239,224,.65); font-size: .86rem; line-height: 1.55; }
        .ene-case-study__footer { position: relative; z-index: 2; display: flex; justify-content: space-between; gap: 2rem; align-items: end; padding-top: 2.1rem; }
        .ene-case-study__footer p { max-width: 42rem; margin: 0; color: rgba(243,239,224,.66); font-size: .92rem; line-height: 1.55; }
        .ene-case-link { flex: 0 0 auto; display: inline-flex; align-items: center; gap: .8rem; padding: .82rem 1rem; border: 1px solid rgba(255,106,0,.75); color: #f3efe0; font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .16em; transition: background .2s ease, color .2s ease; }
        .ene-case-link span { color: ${ORANGE}; font-size: 1rem; }
        .ene-case-link:hover { background: ${ORANGE}; color: #141b1b; }
        .ene-case-link:hover span { color: #141b1b; }

        @media (max-width: 900px) {
          .ene-case-study__head { grid-template-columns: 1fr; gap: 1.35rem; }
          .ene-capabilities { grid-template-columns: repeat(2,minmax(0,1fr)); }
        }
        @media (max-width: 700px) {
          .hero-graffiti { width: 7.8rem !important; height: 4.4rem !important; transform: scaleX(1.42) rotate(-2deg) !important; }
          .hero-signal { gap: .9rem !important; }
          .project-card__media, .project-card--feature .project-card__media { aspect-ratio: 4 / 3 !important; padding: 1rem !important; }
          .project-card__media img { max-width: 91% !important; max-height: 91% !important; }
          .ene-case-study { margin: .8rem 0 2.3rem; padding: 1.5rem 1.2rem 1.6rem; }

          .ene-capability__number { margin-bottom: 1.3rem; }
          .ene-case-study__footer { display: grid; gap: 1.5rem; }
          .ene-case-link { justify-self: start; }
        }
      `;

      function applyOrangeTheme(doc) {
        if (!doc || !doc.head) return;
        let style = doc.getElementById('orange-preview-theme');
        if (!style) {
          style = doc.createElement('style');
          style.id = 'orange-preview-theme';
          doc.head.appendChild(style);
        }
        style.textContent = orangeCSS;
      }

      function uniformizeThumbnails(doc) {
        doc.querySelectorAll('.project-card__media').forEach((media) => {
          const image = media.querySelector('img');
          if (!image) return;
          const src = image.currentSrc || image.src;
          if (src) media.style.setProperty('--thumb-bg', `url("${src.replace(/"/g, '%22')}")`);
        });
      }

      function makePastJobsFirst(doc) {
        const tabs = doc.querySelector('.work-tabs');
        const pastButton = doc.querySelector('[data-tab-target="past-jobs"]');
        const workButton = doc.querySelector('[data-tab-target="selected-work"]');
        if (!tabs || !pastButton || !workButton) return;

        if (pastButton.previousElementSibling !== null) {
          tabs.insertBefore(pastButton, workButton);
        }

        if (!doc.body.dataset.orangePastDefaultApplied) {
          doc.body.dataset.orangePastDefaultApplied = 'true';
          setTimeout(() => pastButton.click(), 40);
        }
      }

      function addENECaseStudy(doc) {
        const pastPanel = doc.getElementById('past-jobs');
        if (!pastPanel) return;

        const existingFeature = doc.getElementById('ene-case-study');
        if (existingFeature && existingFeature.parentElement !== pastPanel) existingFeature.remove();
        if (doc.getElementById('ene-case-study')) return;

        /* Remove the smaller duplicate ENE row so the feature card truly leads the experience list. */
        pastPanel.querySelectorAll('.experience-row').forEach((row) => {
          const title = row.querySelector('h3')?.textContent?.trim().toLowerCase();
          if (title === 'ene security') row.remove();
        });

        const section = doc.createElement('section');
        section.id = 'ene-case-study';
        section.className = 'ene-case-study';
        section.setAttribute('aria-labelledby', 'ene-case-study-title');
        section.innerHTML = `
          <img class="ene-case-study__logo" src="${ENE_LOGO}" alt="ENE Security" />
          <div class="ene-case-study__head">
            <div>
              <p class="ene-kicker">Featured Experience / 2023–2026</p>
              <h3 id="ene-case-study-title">Marketing<br><em>Lead.</em></h3>
            </div>
            <p class="ene-summary">Led the in-house marketing function for a New England commercial security integrator while supporting sales—connecting brand, design, content, events, partner marketing, web, SEO, and sales enablement to the same growth goals.</p>
          </div>
          <div class="ene-meta">
            <span><strong>Role</strong> Marketing Lead + Sales Support</span>
            <span><strong>Locations</strong> Salem, NH / Canton, MA</span>
            <span><strong>Industry</strong> B2B Commercial Security</span>
          </div>
          <div class="ene-capabilities">
            <article class="ene-capability"><p class="ene-capability__number">01 / BRAND + CREATIVE</p><h4>Built the visual system.</h4><p>Brochures, spec sheets, presentations, sales graphics, signage, event materials, social creative, and branded collateral across digital and print.</p></article>

        const intro = pastPanel.querySelector('.experience-intro');
        const list = pastPanel.querySelector('.experience-list');
        if (intro && intro.nextSibling) intro.parentNode.insertBefore(section, intro.nextSibling);
        else if (list) pastPanel.insertBefore(section, list);
        else pastPanel.prepend(section);
      }

      function enhancePreview() {
        try {
          const doc = frame.contentDocument;
          if (!doc || !doc.body) return;
          applyOrangeTheme(doc);
          makePastJobsFirst(doc);
          addENECaseStudy(doc);
          uniformizeThumbnails(doc);
        } catch (error) {
          console.error('Orange preview enhancement could not be applied.', error);
        }
      }

      frame.addEventListener('load', () => {
        enhancePreview();
        [180, 450, 900, 1600, 2600].forEach((delay) => setTimeout(enhancePreview, delay));
        try {
          const doc = frame.contentDocument;
          if (!doc || !doc.body) return;
          const observer = new MutationObserver(() => {
            applyOrangeTheme(doc);
            addENECaseStudy(doc);
            uniformizeThumbnails(doc);
          });
          observer.observe(doc.body, { childList: true, subtree: true });
        } catch (error) {
          console.error('Orange preview observer could not start.', error);
        }
      });
    })();
  </script>
