<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05080d">
  <meta name="description" content="Justin's mobile Patriots and fantasy football dashboard.">
  <title>Justin's Patriots + Fantasy Mobile</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div class="mobile-shell">
    <header class="mobile-header">
      <div class="mobile-brand"><span class="brand-mark">J</span><div><div class="mobile-title">PATRIOTS + FANTASY</div><div class="mobile-subtitle">MOBILE LIVE • 2026</div></div></div>
      <div class="mobile-status"><span id="connectionDot" class="status-dot"></span><span id="connectionText">CONNECTING</span><span id="clock" class="num">--:--</span></div>
    </header>

    <section id="scoreBox" class="score-box" aria-live="polite"><div class="loading-state">CONNECTING TO PATRIOTS LIVE DATA…</div></section>

    <main class="mobile-panels">
      <section class="mobile-panel sleeper-panel">
        <div class="mobile-panel-heading red-heading"><span class="heading-rule"></span><div class="heading-copy"><h2>SLEEPER • THE BIG SENUS</h2><small>STARTERS • BENCH • MATCHUP</small></div><span id="sleeperMeta" class="panel-meta">LOADING</span></div>
        <div id="sleeperContent" class="mobile-panel-content"><div class="loading-state">LOADING SLEEPER ROSTER…</div></div>
      </section>
      <section class="mobile-panel espn-panel">
        <div class="mobile-panel-heading blue-heading"><span class="heading-rule"></span><div class="heading-copy"><h2>ESPN • GUMBY'S BIG D</h2><small>PROJECTIONS → LIVE POINTS</small></div><span id="espnMeta" class="panel-meta">CHECKING</span></div>
        <div id="espnContent" class="mobile-panel-content"><div class="loading-state">CHECKING ESPN LEAGUE…</div></div>
      </section>
    </main>

    <footer class="mobile-footer"><div><span class="footer-dot"></span><span id="footerNote">PATRIOTS + FANTASY LIVE DATA</span></div><div id="lastSync" class="sync">SYNC --:--</div></footer>
  </div>
  <script src="../patriots-fantasy/app.js?v=11" defer></script>
</body>
</html>
