<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy responsive layout check</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d12;color:#dfe7ef;font:14px system-ui}nav{display:flex;gap:10px;padding:15px;align-items:center}button{border:1px solid #526474;border-radius:9px;background:#243442;color:inherit;padding:12px 18px;font:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#f47b35;color:#f47b35}#canvas{margin:0 auto;width:430px;height:932px;transform-origin:top center;border:1px solid #536779;border-radius:12px;overflow:hidden}iframe{width:100%;height:100%;border:0}p{margin:0;color:#91a3b4;font-size:12px}
</style></head><body><nav><button data-width="430" data-height="932" aria-pressed="true">iPhone</button><button data-width="1024" data-height="768" aria-pressed="false">iPad</button><button data-width="1920" data-height="1080" data-tv="true" aria-pressed="false">TV</button><button data-width="1280" data-height="720" data-tv="true" aria-pressed="false">TV 720p</button><button data-width="1280" data-height="600" data-tv="true" aria-pressed="false">TV with toolbar</button><p>Live app at actual device dimensions</p></nav><div id="canvas"><iframe title="Live fantasy device preview" src="../touch/"></iframe></div><script>
document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const c=document.getElementById('canvas');c.style.width=button.dataset.width+'px';c.style.height=button.dataset.height+'px';c.style.marginLeft=(innerWidth-Number(button.dataset.width))/2+'px';c.style.transform='scale('+Math.min(1,(innerWidth-24)/Number(button.dataset.width))+')';c.querySelector('iframe').src=(button.dataset.tv?'../tv/':'../touch/')+'?layout-check='+Date.now();}));
</script></body></html>
