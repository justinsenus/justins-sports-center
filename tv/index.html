<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101820"><title>Fantasy Scores · TV</title>
  <meta name="description" content="Live Sleeper and ESPN matchups, full rosters, recorded score charts, and a synchronized iPad and iPhone TV controller.">
  <link rel="stylesheet" href="../remote/soft-glass.css?v=4">
  <link rel="stylesheet" href="../remote/tv-presentation.css?v=4">
  <link rel="stylesheet" href="../remote/player-details.css?v=1">
</head>
<body data-screen="tv" data-root="../patriots-fantasy-touch/" data-design="soft-glass">
  <div class="glass-shell">
    <header class="glass-header">
      <div class="header-left"><span id="tvContext" class="header-week">Sleeper</span><span id="weekLabel" class="header-week">Week —</span></div>
      <img id="headerMascot" class="header-mascot" src="../patriots-fantasy-touch/assets/justin-mascot-cutout.png" alt="Justin’s mascot">
      <div class="header-right"><div class="remote-indicator"><span id="remoteStatus" role="status">Connecting…</span></div><div class="tv-pair-code">Pair <b id="remoteCode">--------</b></div></div>
    </header>
    <main class="glass-main">
      <section id="matchupHero" aria-label="Matchup scores"><div class="glass-panel loading-state">Connecting your leagues…</div></section>
      
      <section id="workspace" aria-label="Fantasy scoreboard"></section>
    </main>
    <footer class="glass-footer"><span id="sourceStatus">Connecting feeds</span><span id="lastSync">Waiting for providers</span></footer>
  </div>
  <aside id="playerDrawer" class="player-drawer" aria-label="Player stats" hidden></aside>
  
  <section id="pairPanel" class="pair-panel tv-pair" aria-label="Pair your TV controller">
    <img src="../patriots-fantasy-touch/assets/justin-mascot-cutout.png" alt="Justin’s mascot">
    <h1>Connect your controller.</h1><p>Open the controller on your iPad, iPhone, or HP. Enter this TV code.</p><strong id="pairDisplay" class="pair-display">Starting…</strong><p id="pairAddress" class="pair-address"></p><p id="pairError" role="status"></p><button id="newRoom" type="button">New pairing code</button><button id="watchLocal" class="quiet-button" type="button">Watch while I pair</button>
  </section>
  <script src="../patriots-fantasy-touch/source-catalog.js?v=2"></script>
  <script src="../remote/config.js?v=1"></script>
  <script src="../patriots-fantasy-touch/remote-app.js?v=8" defer></script>
  <script src="../remote/chart-timeline.js?v=1" defer></script>
  <script src="../remote/soft-glass.js?v=6" defer></script>
  <script src="../remote/tv-presentation.js?v=4" defer></script>
  <script src="../remote/player-details.js?v=2" defer></script>
  <script src="../remote/session.js?v=1" defer></script>
</body></html>
